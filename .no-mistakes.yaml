# The checks this repository genuinely runs. `no-mistakes ci-workflow` mirrors
# `commands.lint` and `commands.test` into .github/workflows/ci.yml.
commands:
  test: "node --test test/*.test.mjs && bash -n scripts/install-moshi-hook.sh"
  # qmllint lives in Qt6's declarative dev tools and is not always on PATH. Off
  # an Omarchy machine the qs.Ui / qs.Commons imports cannot be resolved and
  # qmllint reports them as warnings; it still fails on a real syntax error.
  lint: 'QMLLINT="$(command -v qmllint || command -v qmllint6 || echo /usr/lib/qt6/bin/qmllint)"; "$QMLLINT" BarWidget.qml Engine.qml Panel.qml'
